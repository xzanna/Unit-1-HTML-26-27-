<!DOCTYPE html>

    <title>Weekly Class Schedule</title>

                <th>Time</th>

                <th>Tuesday</th>
                <th>Wednesday</th>

        <tbody>
            <tr>
                <td>Period 1</td>

            <tr>
                <td>Period 2</td>

                <td>Art</td>
                <td>PE</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
