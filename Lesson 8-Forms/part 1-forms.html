<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <h1>Club Sign-Up</h1>
    <form action="#"method="Get">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="13" max="19">
        <br>
        <label for="startdate">Date you can start:</label>
        <input type="date" name="startdate" id="startdate">
        <br>
        <fieldset>
            <legend>Select Your Grade Level</legend>
            <label for="grade-9">Grade 9</label>
            <input type="radio" name="grade" id="grade-9">

            <label for="grade-10">Grade 10</label>
            <input type="radio" name="grade" id="grade-10">

            <label for="grade-11">Grade 11</label>
            <input type="radio" name="grade" id="grade-11">

            <label for="grade-12">Grade 12</label>
            <input type="radio" name="grade" id="grade-12">
            <br>
            <!-- <label for="period">Select Period</label> -->
            <select name="period" name="period">
                <option value=""disabled selected>Select Period</option>
                <option value="1">Period 1</option>
                <option value="2">Period 2</option>
                <option value="3">Period 3</option>
            </select>
            <label for="grade-9">Grade 9</label>
            <input type="checkbox" name="grade" id="grade-9">
        </fieldset>
        <button type="submit">Join the Club</button>
    </form>
</body>
</html>
