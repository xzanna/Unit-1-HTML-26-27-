<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lesson 10 Sandbox</title>
  <!-- Lesson 10 Sandbox · one STEP per code along. Tag selectors take NO DOT. -->
  <style>
    /* STEP 1 ▸ header: background #101A2B, color white
                footer: background #E2E8F0 */

    header {
        background: #101A2B, color white
    }
    footer:{
        background: #E2E8F0
    }
    /* STEP 2 ▸ nav: background #DBEAFE · aside: background #FEF3C7 */
    nav {background-color: #DBEAFE;}
    aside{background-color: #FEF3C7;}

    /* STEP 3 ▸ main: background #F0FDF4
                section: border-left 4px solid #5ADB8C, padding-left 10px */
    main{background: #F0FDF4}
    section{border-left:4px solid #5adb8c 
            padding-left: 10px;}

    /* STEP 4 ▸ article: border 2px solid #94A3B8, border-radius 8px,
                         padding 6px 12px */
    article{border: 2px, solid, #94A3B8;
            border-radius: 8px;
            padding: 6px 12px;}

  </style>
</head>
<body>

  <!-- STEP 1 ▸ title in <header>, copyright in <footer> -->
  <header>My page</header>
  <p>Page content…</p>
  <footer>© 2025 Me</footer>

  <hr>

  <!-- STEP 2 ▸ menu in <nav>, fun fact in <aside> -->
  <nav>Home · About · Posts</nav>
  <p>The article everyone came to read…</p>
  <aside>Fun fact: octopuses have three hearts.</aside>

  <hr>

  <!-- STEP 3 ▸ both topics in ONE <main>, each topic in its own <section> -->
  <main>
    <section>Welcome to my site…</section>
    <section>Latest news…</section>
  </main>

  <hr>

  <!-- STEP 4 ▸ the whole story in one <article> -->
    <article>
        <h2>Why rain smells good</h2>
      <p>The smell is petrichor — oil from dry soil meeting rain…</p>
    </article>
      

</body>
</html>
