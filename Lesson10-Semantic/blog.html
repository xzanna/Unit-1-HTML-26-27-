<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Semantic Blog Page</title>
  <!-- Semantic Blog Page · graded · five landmarks, one page.
       The styles are done. A stray dot in a selector fails silently. -->
  <style>
    header  { background: #101A2B; color: white; }
    nav     { background: #DBEAFE; }
    main    { background: #F0FDF4; }
    aside   { background: #FEF3C7; }
    footer  { background: #E2E8F0; }
    article { border: 2px solid #94A3B8; border-radius: 8px; padding: 6px 12px; }
  </style>
</head>
<body>

  <!-- 1 ▸ a header with the site title in an h1 -->
  Sam's Blog
<header><h1>Sam's Blog</h1></header>

  <!-- 2 ▸ a nav with three links -->
  <nav>
    <a href="#">Home</a>
    <a href="#">Posts</a>
    <a href="#">About</a>
</nav>

  <!-- 3 ▸ one main holding two articles — each post gets an h2 and a p -->
  <main>
    <article>
        <h2>Post 1</h2>
        <p>post 1 content</p>
    </article>
    <article>
        <h2>Post 2</h2>
        <p>post 2 content</p>
    </artcile>
  </main>

  <!-- 4 ▸ an aside for the about box -->
  <aside>About me</aside>

  <!-- 5 ▸ a footer with the copyright -->
  <footer>© 2026 Sam</footer>
</body>
</html>
